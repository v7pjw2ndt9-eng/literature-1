name: 每日开盘信号

# WHAT TRIGGERS THIS
# Nothing on a clock, and deliberately so. `on: schedule` does not work on this account: the same
# */5 probe ran in this repo and in a freshly created empty one for a combined 186 minutes -- 36
# expected firings -- and produced ZERO runs, while workflow_dispatch succeeded 6/6 over the same
# period. Four cron entries used to sit here as a "maybe it comes back" hedge; they were removed
# because a trigger that has never once fired is not a hedge, it is a thing that looks like one.
#
# The daily clock now lives in daily-chain.yml: an environment wait timer holds a job for 23h45m,
# and on waking it dispatches the next one (GITHUB_TOKEN cannot start most workflows, but
# workflow_dispatch is an explicit exception) and then calls this workflow via workflow_call.
#
# So this file is reached two ways, both of which are measured to work:
#   - daily-chain.yml, once a day, automatically
#   - you, manually, from the Actions tab
#
# TIMING
# 09:00 Beijing the commodity day session opens, so the gate is computable. 09:25 the stock's call
# auction fixes the open, so the bracket prices are computable. A late run is not a wrong run: the
# open does not change once set, only the time left to act shrinks. Every message carries the
# Beijing timestamp it was built at, so lateness is visible rather than silent.
on:
  workflow_dispatch:              # manual run, for testing
    inputs:
      force:
        description: "强制发送(忽略休市判断)—— 周末/节假日测试用,内容取上一个交易日"
        type: boolean
        default: false
  # Invoked by daily-chain.yml, which owns the daily clock (environment wait timer + self-dispatch).
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false

concurrency:
  group: daily-signal
  cancel-in-progress: false

permissions:
  contents: read
  actions: read                   # needed to see whether an earlier run today already sent

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-deps
        run: pip install --quiet numpy

      # Chinese exchange holidays are not expressible in cron, so the run is skipped when the market
      # is plainly not open. The check is data-driven rather than a hardcoded holiday list: if no
      # commodity has produced a day-session open, there is no session today.
      - name: market-open-check
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, urllib.request, datetime, re, sys

          # $GITHUB_OUTPUT accepts ONLY key=value lines. The whole script's stdout used to be
          # redirected into it, which meant every ::notice:: went in there too -- and a notice with no
          # "=" in it fails the step outright. (The one that did contain "=" merely created a junk
          # variable and never showed up as an annotation.) So: outputs are written here, explicitly,
          # and everything else goes to the log where it belongs.
          def emit(v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"trading={v}\n")

          # Manual override, so delivery can be proven on a weekend instead of waiting for Monday.
          # Left false by daily-chain.yml, so the holiday check still applies on the automatic path.
          if os.environ.get("FORCE") == "true":
              emit("true")
              print("::notice::强制发送已开启,跳过休市判断(内容取上一个交易日,仅用于验证投递)")
              sys.exit(0)
          ctx = ssl.create_default_context()
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime("%Y-%m-%d")
          req = urllib.request.Request(
              "https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20_=/"
              "InnerFuturesNewService.getFewMinLine?symbol=MA0&type=120",
              headers={"User-Agent": "Mozilla/5.0", "Referer": "https://finance.sina.com.cn"})
          try:
              t = urllib.request.urlopen(req, timeout=25, context=ctx).read().decode("utf-8", "replace")
              i, j = t.find("["), t.rfind("]")
              rows = json.loads(re.sub(r'([{,])\s*(\w+)\s*:', r'\1"\2":', t[i:j+1]))
              open_today = any((r.get("d") or "").startswith(today) for r in rows)
          except Exception as e:
              print(f"::warning::开市判断失败,按开市处理: {e}")
              open_today = True
          emit("true" if open_today else "false")
          print(f"::notice::{today} 开市={open_today}")
          PY

      # The chain can end up doubled (a manual dispatch while one is already waiting), and a manual
      # run can land on a day the chain already covered. Either way the second one through must not
      # send again. FAIL-OPEN on any error: a duplicate email is a nuisance, a silently skipped one
      # is the whole problem this project has been fighting.
      - name: dedupe-check
        id: dedupe
        if: steps.gate.outputs.trading == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, datetime

          LAST = {"d": ""}

          def out(v, why):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"already={v}\n")
                  f.write(f"last_sent={LAST['d']}\n")
              print(f"::notice::{why}")
              sys.exit(0)

          if os.environ.get("FORCE") == "true":
              out("false", "强制发送:不做重复检查")

          def api(path):
              r = urllib.request.Request("https://api.github.com" + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json", "User-Agent": "daily-signal"})
              return json.loads(urllib.request.urlopen(r, timeout=25).read())

          repo, me = os.environ["REPO"], int(os.environ["RUN_ID"])
          today = (datetime.datetime.now(datetime.timezone.utc)
                   + datetime.timedelta(hours=8)).strftime("%Y-%m-%d")
          # Two things are learned from one pass over the history: whether TODAY is already done
          # (dedupe), and when the last successful send was (miss detection). A morning that produces
          # no email at all is invisible unless the next one says so, and with schedules that GitHub
          # the chain can break silently, that gap has to be reported rather than assumed away.
          try:
              # ALL runs, not this workflow's. A run reached through workflow_call belongs to the
              # CALLING workflow (daily-chain.yml), so a per-workflow query would miss it entirely and
              # a manual run would then send a second copy. A send is identified by the STEP name,
              # which is ASCII so no encoding accident can silently break the match; other workflows
              # (pages builds) are ignored for free.
              runs = api(f"/repos/{repo}/actions/runs?per_page=60")
              for run in sorted(runs.get("workflow_runs", []),
                                key=lambda r: r["created_at"], reverse=True):
                  if run["id"] == me or run["conclusion"] != "success":
                      continue
                  started = (datetime.datetime.strptime(run["created_at"], "%Y-%m-%dT%H:%M:%SZ")
                             + datetime.timedelta(hours=8)).strftime("%Y-%m-%d")
                  sent = any(st["name"].startswith("send-mail") and st.get("conclusion") == "success"
                             for job in api(f"/repos/{repo}/actions/runs/{run['id']}/jobs").get("jobs", [])
                             for st in job.get("steps", []))
                  if not sent:
                      continue
                  if not LAST["d"] or started > LAST["d"]:
                      LAST["d"] = started
                  if started == today:
                      out("true", f"今天 {run['id']} 已经发过了({run['created_at']}),本次跳过")
          except Exception as e:
              out("false", f"重复检查失败,按未发送处理(宁可重复也不能漏): {e}")
          out("false", f"{today} 今天还没发过,继续(上次成功发送 {LAST['d'] or '无记录'})")
          PY

      # The dedupe step identifies a past send by this step's name. Keeping the name ASCII means a
      # copy/paste that mangles encoding can no longer silently break the match and mail twice a day.
      - name: send-mail
        if: steps.gate.outputs.trading == 'true' && steps.dedupe.outputs.already != 'true'
        working-directory: signal
        env:
          # Set these as repository secrets. They are never read from the repo, never logged, and
          # never leave the runner.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LAST_SENT: ${{ steps.dedupe.outputs.last_sent }}
          POSITIONS_GIST_RAW_URL: ${{ secrets.POSITIONS_GIST_RAW_URL }}
        run: python3 daily_signal.py --wait-open --send

      - name: skipped-holiday
        if: steps.gate.outputs.trading != 'true'
        run: echo "今天没有商品日盘开盘,判定为休市,不发信。"

      - name: skipped-already-sent
        if: steps.gate.outputs.trading == 'true' && steps.dedupe.outputs.already == 'true'
        run: echo "今天更早的一次运行已经把邮件发出去了,本次不重复发送。"
