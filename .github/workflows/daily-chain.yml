name: daily-chain

# WHY THIS EXISTS
# `on: schedule` does not work on this account. Measured, not guessed: the same */5 probe ran in two
# repositories -- including a freshly created empty one -- for a combined 186 minutes, 36 expected
# firings, and produced ZERO workflow runs, while workflow_dispatch succeeded 6/6 over the same period.
#
# HOW THIS REPLACES IT, WITHOUT on: schedule AND WITHOUT A PAT
# An environment wait timer is a real GitHub-internal clock: 1..43200 minutes, free on public repos,
# and the waiting time is not billed. And GITHUB_TOKEN normally cannot start another workflow -- except
# that "workflow_dispatch and repository_dispatch events always create workflow runs". Those two facts
# together make a self-perpetuating chain: each run waits, wakes, immediately arms tomorrow's run, then
# does today's work.
#
# THE THREE WAYS A CHAIN LIKE THIS DIES, AND WHAT IS DONE ABOUT EACH
#   1. A run fails before arming the next one  -> the chain stops forever.
#      Arming happens right after the alignment sleep and before anything that touches the network,
#      so a failed email costs one morning, not every morning after it. A second `if: failure()`
#      arm covers the case where even the alignment step dies.
#   2. Two chains start (a manual dispatch while one is already waiting) -> two emails a day, forever.
#      Before arming, the run asks the API whether another run of THIS workflow is already waiting or
#      queued, and if so does not arm. That makes a duplicate chain self-healing rather than permanent.
#   3. A weekend or holiday skips the job -> nothing arms Monday.
#      The whole job never skips. Only the mail step is conditional.
#
# WHY 01:26 UTC AND NOT EARLIER
# 09:26 Beijing, one minute after the call auction fixes the stock's open -- as early as the
# bracket prices can exist, since every minute later is a minute less to place the orders. If
# Eastmoney has not published the open yet at 09:26, --wait-open polls every 20s for it. Firing at 09:07 meant the
# open did not exist yet, so the script had to poll for it -- and Eastmoney reports a not-yet-known
# price as the STRING "-", which made the old code raise TypeError and kill the run outright. Landing
# after 09:25 removes the need to poll at all. The commodity day session opened at 09:00, so the gate
# is computable either way.
#
# WHY ARMING COMES AFTER THE SLEEP, NOT BEFORE
# The wait timer is 1425 minutes -- 15 short of a day -- so whatever moment a run arms from becomes
# 15 minutes earlier tomorrow. Arming before the alignment sleep pins that moment to the wait timer's
# release time, and the whole chain walks backwards: 00:53, 00:38, 00:23 ... and by day seven it
# releases at 23:43, which is 104 minutes early, trips the 90-minute guard, and fires at 07:43 Beijing
# -- before the market opens, with no opening price to quote. Arming AFTER the sleep pins it to 01:26
# instead, so the next release is 01:11 and the sleep puts it back on 01:26: a fixed point. It also
# self-corrects lateness -- wake at 01:50 and the next release is 01:35, then 01:20, then back to 01:26.
#
# STARTING IT
# Run it manually once, at or shortly after 01:26 UTC (09:26 Beijing) -- the alignment step only ever
# sleeps FORWARD, so starting after the target lands the chain on it immediately. After that it re-arms
# itself daily.
# There is still no SLA here: cancel the waiting run, or disable Actions, and the chain stops. But it
# rides on workflow_dispatch, which is the one path measured to work in this account.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write          # required to dispatch the next run and to read run states

concurrency:
  group: daily-chain      # one chain at a time; a second dispatch queues rather than doubling
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The wait timer lives on this environment. Create it once:
    #   Settings -> Environments -> New environment -> name: daily-clock
    #   Wait timer: 1425 minutes (23h45m), no reviewers, no branch restriction
    # 1425 rather than 1380: waking 15 min early costs 15 min of sleep instead of an hour, and the
    # align step below absorbs the remaining drift in either direction.
    environment: daily-clock
    outputs:
      armed: ${{ steps.arm.outputs.armed }}
    steps:
      # ---- 1. align to 01:26 UTC (09:26 Beijing) ----
      - name: align-to-target
        run: |
          set -Eeuo pipefail
          TARGET_UTC="01:26"
          now=$(date -u +%s)
          today=$(date -u +%F)
          target=$(date -u -d "${today} ${TARGET_UTC}:00" +%s)
          # If the target already passed today, do not sleep ~24h waiting for tomorrow -- the brief is
          # still actionable all session, and tomorrow's run is already armed.
          if [ "$now" -lt "$target" ]; then
            delay=$((target - now))
            if [ "$delay" -le 5400 ]; then
              echo "sleeping ${delay}s until ${TARGET_UTC}Z"
              sleep "$delay"
            else
              echo "::warning::woke ${delay}s early (more than 90 min) -- proceeding now rather than idling"
            fi
          else
            late=$((now - target))
            [ "$late" -gt 3600 ] && echo "::warning::woke $((late / 60)) min after ${TARGET_UTC}Z; prices are still valid, only the time left to act is shorter"
          fi
          echo "::notice::fired at $(date -u +%FT%TZ) (target ${TARGET_UTC}Z)"

      # ---- 2. arm tomorrow, FROM THE ALIGNED TIME. Must come after the sleep (see header). ----
      - name: arm-next-run
        id: arm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Refuse to arm if another run of this workflow is already waiting or queued -- that is the
          # signature of a second chain, and arming again would make the duplication permanent.
          pending=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-chain.yml/runs?per_page=100" \
                      --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})
                             | select(.status == \"waiting\" or .status == \"queued\"
                                      or .status == \"pending\" or .status == \"requested\")] | length" \
                    || echo "err")
          if [ "$pending" = "err" ]; then
            echo "::warning::could not check for a pending run; arming anyway (a missing chain is worse than a duplicate)"
          elif [ "$pending" -gt 0 ]; then
            echo "armed=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning::$pending run(s) of this workflow are already waiting -- not arming, to avoid a second chain"
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-chain.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo "armed=yes" >> "$GITHUB_OUTPUT"
          echo "::notice::armed the next run; it will wait on the daily-clock environment"

      # ---- 3. failsafe: if even the alignment step died, the chain must still survive. ----
      # Only fires when something above failed AND the normal arm did not already succeed, so it can
      # never produce a second dispatch on the happy path. The arming time is wrong in this case (it is
      # whenever the failure happened, not 01:26), but the next day's align step pulls it back.
      - name: arm-failsafe
        if: failure() && steps.arm.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pending=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-chain.yml/runs?per_page=100" \
                      --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})
                             | select(.status == \"waiting\" or .status == \"queued\"
                                      or .status == \"pending\" or .status == \"requested\")] | length" \
                    || echo "err")
          if [ "$pending" != "err" ] && [ "$pending" -gt 0 ]; then
            echo "::warning::failsafe: $pending run(s) already waiting -- not arming"
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-chain.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo "::warning::failsafe armed the next run after a failure; tomorrow's align step will re-centre the time"

  # ---- 4. today's actual work: the same job the manual workflow runs, so there is one implementation ----
  signal:
    needs: tick
    uses: ./.github/workflows/daily-signal.yml
    secrets: inherit
