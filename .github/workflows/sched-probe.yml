name: 调度探针(用完即删)

# A throwaway probe to answer ONE question: does this repository get scheduled dispatches AT ALL?
#
# It must not live in the real workflow. Putting */5 on daily-signal.yml would mean 288 firings a day,
# and if the dedupe step ever failed open that becomes 288 emails. This does nothing but echo, so the
# blast radius is zero and the answer is unambiguous: count the runs after an hour.
#
# Expected if scheduling is healthy: ~12 runs per hour.
# Delete this file once the count is known.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 打个时间戳
        run: |
          echo "dispatched_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::notice::probe fired at $(date -u +%H:%M:%S)Z"
